name: palworld

services:
  palworld:
    image: thijsvanloef/palworld-server-docker:latest
    container_name: palworld-server
    restart: unless-stopped
    stop_grace_period: 45s

    ports:
      - "8211:8211/udp"     # game
      # Administration is available through docker --context optiplex compose exec.

    environment:
      # server identity and access
      TZ: "Europe/Amsterdam"
      SERVER_NAME: "EnemyLAV"
      PLAYERS: 4
      CROSSPLAY_PLATFORMS: "(Steam)"
      SERVER_PASSWORD: ${SERVER_PASSWORD:?Set SERVER_PASSWORD in the laptop .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in the laptop .env}

      # administration and player list
      RCON_ENABLED: true
      SHOW_PLAYER_LIST: "True"

      # empty-world pause
      AUTO_PAUSE_ENABLED: true
      AUTO_PAUSE_TIMEOUT_EST: 1800 # 30m

      # scheduled restart
      AUTO_REBOOT_ENABLED: true
      AUTO_REBOOT_CRON_EXPRESSION: "0 4 * * *"

      # game updates
      AUTO_UPDATE_ENABLED: true
      AUTO_UPDATE_CRON_EXPRESSION: "45 * * * *"
      AUTO_UPDATE_WARN_MINUTES: 5

      # backup schedule and retention
      BACKUP_CRON_EXPRESSION: "30 3 * * *"
      DELETE_OLD_BACKUPS: true
      OLD_BACKUP_DAYS: 14

    volumes:
      - type: bind
        source: /d/palworld
        target: /palworld
        bind:
          create_host_path: true

    # Container memory ceiling; the host also needs memory for the OS and Docker.
    mem_limit: 6g
    mem_reservation: 2g

    logging:
      options:
        max-size: "10m"
        max-file: "3"

  # Read-only JSON API: online players, pause state, join/leave/pause events.
  # Localhost-only on optiplex; expose later via cloudflared or an SSH tunnel.
  api:
    build: ./sidecar
    container_name: palworld-api
    restart: unless-stopped

    depends_on:
      - palworld

    environment:
      TZ: "Europe/Amsterdam"
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in the laptop .env}
      PALWORLD_REST_URL: http://palworld:8212
      # Shown on the dashboard as the connect address (the game API does not
      # know its own public hostname):
      CONNECT_ADDRESS: "pal.enenmylav.cloud:8211"
      # Optional bearer token for /api/* (set when exposing beyond localhost):
      # API_TOKEN: ${API_TOKEN:-}

    ports:
      - "8321:8080"  # readonly JSON API + dashboard, LAN/DMZ

    volumes:
      # Auto-pause flag file (.paused) lives on the data mount; read-only.
      - type: bind
        source: /d/palworld
        target: /state
        read_only: true

    mem_limit: 64m

    logging:
      options:
        max-size: "10m"
        max-file: "3"
